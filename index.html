<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leandro Celulares</title>
  <meta name="description" content="Leandro Celulares — iPhones, fones, carregadores e capinhas.">
  <meta name="theme-color" content="#e4e8f3">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Cabeçalho -->
  <header class="header" id="header">
    <div class="header__inner">
      <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <a href="#/" class="logo" aria-label="Leandro Celulares - início">
        <img src="assets/img/logo.png" alt="Leandro Celulares">
      </a>
      <nav class="header__nav" aria-label="Principal">
        <a href="#/" data-nav="home">Início</a>
        <a href="#/categorias" data-nav="categorias">Categorias</a>
        <a href="#/contato" data-nav="contato">Contato</a>
      </nav>
      <div class="header__actions">
        <button class="icon-btn" id="searchBtn" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5.5 5.5"/></svg>
        </button>
        <button class="icon-btn cart-btn" id="cartBtn" aria-label="Sacola">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <!-- Navegação inferior (mobile) -->
  <nav class="bottom-nav" aria-label="Navegação">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" class="fill"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5L12 3Z"/></svg>
      <span>Início</span>
    </a>
    <a href="#/categorias" data-nav="categorias">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span>Categorias</span>
    </a>
    <a href="#/contato" data-nav="contato">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>
      <span>Contato</span>
    </a>
  </nav>

  <!-- Menu lateral -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer drawer--left" id="menuDrawer" aria-label="Menu">
    <div class="drawer__head">
      <img src="assets/img/logo.png" alt="Leandro Celulares" class="drawer__logo">
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <nav class="drawer__nav" id="menuLinks"></nav>
  </aside>

  <!-- Sacola -->
  <aside class="drawer drawer--right" id="cartDrawer" aria-label="Sacola">
    <div class="drawer__head">
      <h2>Sua sacola</h2>
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="cart" id="cartBody"></div>
  </aside>

  <!-- Busca -->
  <div class="search" id="search" role="dialog" aria-label="Buscar produtos">
    <div class="search__bar">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5.5 5.5"/></svg>
      <input type="search" id="searchInput" placeholder="Buscar iPhone, fone, capinha..." autocomplete="off">
      <button class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="search__results" id="searchResults"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
