<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leandro Celulares — iPhones e acessórios</title>
  <meta name="description" content="Leandro Celulares: iPhones, fones, carregadores e capinhas com garantia, parcelamento e atendimento pelo WhatsApp.">
  <meta name="theme-color" content="#e4e8f3">
  <meta property="og:title" content="Leandro Celulares">
  <meta property="og:description" content="Tudo começa com um novo iPhone. Encontre o seu na Leandro.">
  <meta property="og:image" content="assets/img/hero-iphone.jpg">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="preload" href="assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" as="image" href="assets/img/hero-iphone.jpg" imagesrcset="assets/img/hero-iphone.jpg 1080w, assets/img/hero-iphone-hd.jpg 1920w" imagesizes="(min-width: 900px) 70vw, 100vw">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Ícones -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.3 7.5 9.5 4.4-1.2 7.5-4.9 7.5-9.5V6L12 3Z"/><path d="m8.8 12 2.2 2.2 4.3-4.4"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3.5 7.5 7 11"/><path d="M3.5 7.5H17a3.5 3.5 0 0 1 3.5 3.5"/><path d="m17 20 3.5-3.5L17 13"/><path d="M20.5 16.5H7A3.5 3.5 0 0 1 3.5 13"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2.5 6.5h11v9h-11zM13.5 9.5h4l3 3.2v2.8h-7"/><circle cx="6.5" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 5 5.2-1.4A9.8 9.8 0 1 0 12 2.2Zm0 17.9a8.1 8.1 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1 1 12 20.1Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <!-- Cabeçalho -->
  <header class="header" id="header">
    <div class="topbar" aria-live="off"><div class="topbar__track" id="topbar"></div></div>
    <div class="header__inner">
      <a href="#/" class="logo" aria-label="Leandro Celulares - início">
        <img src="assets/img/logo.png" alt="Leandro Celulares">
      </a>
      <nav class="header__nav" aria-label="Principal">
        <a href="#/" data-nav="home">Início</a>
        <div class="nav-drop">
          <a href="#/categorias" data-nav="categorias" class="nav-drop__trigger" aria-haspopup="true">Categorias
            <svg viewBox="0 0 24 24" class="chev"><path d="m6 9 6 6 6-6"/></svg></a>
          <div class="mega" id="mega"></div>
        </div>
        <a href="#/produto/iphone-16" data-nav="novidade">Lançamentos</a>
        <a href="#/contato" data-nav="contato">Contato</a>
      </nav>
      <div class="header__actions">
        <button class="header__search" id="searchPill" aria-label="Buscar produtos">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5.5 5.5"/></svg>
          <span>Buscar produtos</span><kbd>/</kbd>
        </button>
        <a class="header__wa" id="headerWa" target="_blank" rel="noopener"><svg><use href="#i-wa"/></svg>Fale conosco</a>
        <button class="icon-btn search-icon" id="searchBtn" aria-label="Buscar">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5.5 5.5"/></svg>
        </button>
        <button class="icon-btn cart-btn" id="cartBtn" aria-label="Sacola">
          <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
        <button class="icon-btn burger" id="menuBtn" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <span class="header__progress" id="progress"></span>
  </header>

  <main id="app" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>

  <!-- WhatsApp flutuante -->
  <a class="wa-fab" id="waFab" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg><use href="#i-wa"/></svg>
  </a>

  <!-- Navegação inferior (mobile) -->
  <nav class="bottom-nav" aria-label="Navegação">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" class="fill"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5L12 3Z"/></svg>
      <span>Início</span>
    </a>
    <a href="#/categorias" data-nav="categorias">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span>Categorias</span>
    </a>
    <a href="#/contato" data-nav="contato">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>
      <span>Contato</span>
    </a>
  </nav>

  <!-- Menu (celular) em tela cheia -->
  <nav class="menu" id="menu" aria-label="Menu" aria-hidden="true"><div class="menu__inner" id="menuLinks"></div></nav>

  <div class="overlay" id="overlay"></div>

  <!-- Sacola -->
  <aside class="drawer drawer--right" id="cartDrawer" aria-label="Sacola">
    <div class="drawer__head">
      <h2>Sua sacola</h2>
      <button class="icon-btn" data-close aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="cart" id="cartBody"></div>
  </aside>

  <!-- Busca -->
  <div class="search" id="search" role="dialog" aria-label="Buscar produtos">
    <div class="search__bar">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5.5 5.5"/></svg>
      <input type="search" id="searchInput" placeholder="Buscar iPhone, fone, capinha..." autocomplete="off">
      <button class="icon-btn" data-close aria-label="Fechar"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="search__results" id="searchResults"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
